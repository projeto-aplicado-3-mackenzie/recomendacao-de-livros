<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recomendação de livros</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/app.js" type="module"></script>
</head>
<body>
  <main class="container" id="descobrir">
    <header>
      <h1>Recomendação de livros</h1>
      <p>Escolha um livro para encontrar leituras semelhantes.</p>
    </header>

    <form id="search-form">
      <label for="book-search">Título ou autor</label>

      <div class="search-controls">
        <div class="search-field-wrap">
          <input
            id="book-search"
            type="search"
            placeholder="Buscar livro..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="search-options"
            aria-autocomplete="list"
            aria-describedby="search-help"
            disabled
          >
          <ul id="search-options" role="listbox"
              aria-label="Livros encontrados" hidden></ul>
        </div>

        <select id="result-count" aria-label="Quantidade de recomendações">
          <option value="10">10 resultados</option>
          <option value="5">5 resultados</option>
        </select>

        <button id="recommend-button" type="submit" disabled>
          Recomendar
        </button>
      </div>

      <p class="muted" id="search-help">
        Digite ao menos duas letras e selecione um livro.
      </p>

      <div class="selected-book" id="selected-book" hidden>
        <div>
          <strong id="selected-title"></strong>
          <span id="selected-author"></span>
        </div>
        <button type="button" id="clear-selection">Limpar</button>
      </div>
    </form>

    <p class="muted" id="catalog-count">Carregando catálogo...</p>

    <div class="error-message" id="load-error" role="alert" hidden>
      <p id="load-error-text"></p>
      <button id="retry-load" type="button">Tentar novamente</button>
    </div>

    <noscript>Ative o JavaScript para consultar as recomendações.</noscript>

    <section id="results" aria-labelledby="results-title" hidden>
      <div class="results-heading">
        <h2 id="results-title" tabindex="-1">Recomendações</h2>
        <button id="share-results" type="button">Copiar link</button>
      </div>

      <p class="muted" id="results-context"></p>
      <div class="results-grid" id="results-grid"></div>
      <p id="empty-results" hidden>
        Nenhuma recomendação encontrada. Tente outro livro.
      </p>
    </section>
  </main>

  <dialog id="book-dialog" aria-labelledby="dialog-title">
    <button id="close-dialog" type="button">Fechar</button>
    <div id="dialog-content"></div>
  </dialog>

  <div id="announcer" class="sr-only"
       role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
